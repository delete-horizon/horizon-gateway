[lints]
workspace = true

[package]
name = "horizon-gateway-serve"
version = "2.8.5"
edition = "2021"
description = "Headless Horizon Gateway backend (proxy, mock, transparent proxy)"

[lib]
name = "horizon_gateway_serve_lib"
path = "src/lib.rs"

[[bin]]
name = "horizon-gateway-serve"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3"

[dependencies]
hg-core = { path = "../hg-core" }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream", "gzip", "brotli"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3.31"
axum = { version = "0.7", features = ["macros"] }
hyper = "1"
tower-http = { version = "0.6.8", features = ["cors"] }
get_if_addrs = "0.5.3"
hyper-util = { version = "0.1", features = ["client-legacy", "service"] }
hickory-resolver = { version = "0.25", features = ["tokio"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-pki-types = "1.11"
tokio-rustls = "0.26"
rcgen = "0.13"
time = "0.3"
uuid = { version = "1.21.0", features = ["v4", "serde"] }
http-body-util = "0.1.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-core = "0.1.36"
base64 = "0.21"
jsonschema = "0.26"
aes-gcm = "0.10"
jsonwebtoken = "9"
urlencoding = "2.1"
hex = "0.4.3"
sha2 = "0.10"
hmac = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
specta = { version = "=2.0.0-rc.25", features = ["derive", "chrono"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(not(windows))'.dependencies]
tray-icon = "0.21"
png = "0.17"
tao = "0.34"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windivert = { version = "0.6", features = ["vendored"] }
windivert-sys = { version = "0.10", features = ["vendored"] }
windows = { version = "0.48", features = ["Win32_Foundation"] }
etherparse = "0.13"
