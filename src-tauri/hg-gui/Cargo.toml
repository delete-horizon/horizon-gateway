[lints]
workspace = true

[package]
name = "horizon-gateway"
version = "2.8.8"
description = "Horizon Gateway Tauri GUI shell"
authors = ["you"]
edition = "2021"
default-run = "horizon-gateway"

[lib]
name = "horizon_gateway_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dependencies]
hg-core = { path = "../hg-core" }
tauri = { version = "2" }
specta = { version = "=2.0.0-rc.25", features = ["derive", "chrono"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
specta-typescript = "=0.0.12"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.21.0", features = ["v4", "serde"] }
rustls = { version = "0.23", features = ["ring"] }
tokio = { version = "1", features = ["time", "rt-multi-thread", "macros", "net", "io-util", "sync"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-core = "0.1.36"

base64 = "0.21.7"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"
tiny-skia = "0.11"
once_cell = "1"
parking_lot = "0.12"
local-ip-address = "0.6"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = [
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
] }


