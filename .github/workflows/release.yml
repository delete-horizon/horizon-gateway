name: "Release"

on:
  push:
    tags:
      - "v*"

jobs:
  # 0. Fail fast if git tag != package/tauri/Cargo versions (prevents latest.json lying)
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: verify tag matches package / tauri.conf / Cargo.toml
        run: node scripts/verify-release-version.mjs "${{ github.ref_name }}"

  # 1. Draft Release를 딱 '한 번만' 먼저 생성하는 잡
  create-release:
    needs: verify-version
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: create release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          # 푸시된 태그 이름을 사용하여 Draft를 만듭니다.
          tag_name: ${{ github.ref_name }}
          # ref_name already includes leading "v" (e.g. v2.6.6) — do not prefix another "v"
          name: "Horizon Gateway ${{ github.ref_name }}"
          body: "See the assets below to download the latest version of Horizon Gateway."
          draft: true
          prerelease: false

  # 2. 빌드 및 에셋 업로드 (매트릭스)
  publish:
    needs: [verify-version, create-release] # 버전 검증 + 릴리스 생성 완료 대기
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Re-check on each runner so a bad matrix job cannot upload mismatched artifacts
      - name: verify tag matches package / tauri.conf / Cargo.toml
        run: node scripts/verify-release-version.mjs "${{ github.ref_name }}"

      # 1. pnpm 설치 (새로 추가된 부분!)
      - name: install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.26.0

      # 2. Node.js 설정 및 pnpm 캐시 활성화
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm' # 매번 다운로드하지 않도록 캐싱 추가

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # 3. 이제 정상적으로 실행됩니다!
      - name: install frontend dependencies
        run: pnpm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Official WinDivert x64 redistributable (dll/lib/sys) for dynamic link on Windows
          WINDIVERT_PATH: ${{ github.workspace }}/src-tauri/hg-gui/resources/windivert
        with:
          # 중요: 위에서 생성된 Release ID를 그대로 사용합니다.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  # 3. SHA256SUMS for installer and updater binaries.
  # Included: every asset publish uploaded, except the exclusions below.
  # Excluded: *.sig (Tauri minisign signatures) and latest.json (updater manifest).
  # A previous SHA256SUMS is not an input, so a re-run does not hash itself.
  # Line format: "<64 lowercase hex><two spaces><filename>", LC_ALL=C sorted by filename.
  # Uses the runner's gh. No extra action, so nothing new to pin.
  sha256sums:
    needs: publish
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir release-assets \
            --clobber
          echo "Downloaded assets:"
          find release-assets -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort

      - name: Write SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          files=()
          mapfile -d '' files < <(
            find . -maxdepth 1 -type f \
              ! -name '*.sig' \
              ! -name 'latest.json' \
              ! -name 'SHA256SUMS' \
              -printf '%f\0' \
            | LC_ALL=C sort -z
          )
          if ((${#files[@]} == 0)); then
            echo "No installer or updater assets to hash" >&2
            exit 1
          fi
          sha256sum -- "${files[@]}" > SHA256SUMS
          if grep -qvE '^[0-9a-f]{64}  .+$' SHA256SUMS; then
            echo "SHA256SUMS is not in '<hash>  <filename>' form" >&2
            cat SHA256SUMS >&2
            exit 1
          fi
          cut -c67- SHA256SUMS | LC_ALL=C sort -c
          echo "SHA256SUMS ($(wc -l < SHA256SUMS) files):"
          cat SHA256SUMS

      - name: Upload SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" \
            release-assets/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber