name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'website/**'
      - 'docs/**'
      - 'README.md'
      - 'README.ko.md'
      - 'CHANGELOG.md'
      - 'CHANGELOG.ko.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'website/**'
      - 'docs/**'
      - 'README.md'
      - 'README.ko.md'
      - 'CHANGELOG.md'
      - 'CHANGELOG.ko.md'

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10.26.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10.26.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build injection script
        run: pnpm build:injection

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets

      - name: Test
        working-directory: src-tauri
        run: cargo test --workspace

  # PR 2 of docs/CORE_EXTRACTION_PLAN.md: headless daemon + hgc, no display.
  # Fixed ports 17345/17346/8888 (and setup 13030) are still hardcoded; a busy
  # port fails this job. Port discovery is plan PR 3.
  serve-headless-smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Build headless serve and hgc
        working-directory: src-tauri
        run: cargo build -p horizon-gateway-serve -p hgc

      - name: Headless daemon smoke (no display)
        env:
          HG_SERVE_BIN: src-tauri/target/debug/horizon-gateway-serve
          HG_HGC_BIN: src-tauri/target/debug/hgc
        run: |
          unset DISPLAY
          unset WAYLAND_DISPLAY
          node scripts/smoke-headless-serve.mjs
