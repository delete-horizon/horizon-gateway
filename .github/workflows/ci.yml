name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'website/**'
      - 'docs/**'
      - 'README.md'
      - 'README.ko.md'
      - 'CHANGELOG.md'
      - 'CHANGELOG.ko.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'website/**'
      - 'docs/**'
      - 'README.md'
      - 'README.ko.md'
      - 'CHANGELOG.md'
      - 'CHANGELOG.ko.md'

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10.26.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10.26.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build injection script
        run: pnpm build:injection

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets

      - name: Test
        working-directory: src-tauri
        run: cargo test --workspace

  # Headless daemon + hgc on each OS. The scenario is the same.
  # Linux also checks that the child has no DISPLAY. Fixed ports
  # 17345/17346/8888 are still hardcoded; a busy port fails the job.
  serve-headless-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            script: scripts/smoke-headless-serve-linux.mjs
            serve_bin: src-tauri/target/debug/horizon-gateway-serve
            hgc_bin: src-tauri/target/debug/hgc
          - os: windows-latest
            script: scripts/smoke-headless-serve-windows.mjs
            serve_bin: src-tauri/target/debug/horizon-gateway-serve.exe
            hgc_bin: src-tauri/target/debug/hgc.exe
          - os: macos-latest
            script: scripts/smoke-headless-serve-macos.mjs
            serve_bin: src-tauri/target/debug/horizon-gateway-serve
            hgc_bin: src-tauri/target/debug/hgc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Build headless serve and hgc
        working-directory: src-tauri
        run: cargo build -p horizon-gateway-serve -p hgc

      - name: Headless daemon smoke
        env:
          HG_SERVE_BIN: ${{ matrix.serve_bin }}
          HG_HGC_BIN: ${{ matrix.hgc_bin }}
        run: node ${{ matrix.script }}
