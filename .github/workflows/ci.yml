name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'website/**'
      - 'docs/**'
      - 'README.md'
      - 'README.ko.md'
      - 'CHANGELOG.md'
      - 'CHANGELOG.ko.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'website/**'
      - 'docs/**'
      - 'README.md'
      - 'README.ko.md'
      - 'CHANGELOG.md'
      - 'CHANGELOG.ko.md'

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.26.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Test
        run: pnpm test

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.26.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build injection script
        run: pnpm build:injection

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # Default workspace build covers hg-core, hg-avatar, hg-gui (horizon-gateway),
      # hg-serve, and hgc. The desktop shell binary needs its own feature.
      - name: Build
        working-directory: src-tauri
        run: |
          cargo build --workspace
          cargo build -p horizon-gateway --bin horizon-gateway-workspace --features workspace-shell

      - name: Clippy
        working-directory: src-tauri
        run: |
          cargo clippy --workspace --all-targets
          cargo clippy -p horizon-gateway --bin horizon-gateway-workspace --features workspace-shell

      - name: Test
        working-directory: src-tauri
        run: |
          cargo test --workspace
          cargo test -p horizon-gateway --bin horizon-gateway-workspace --features workspace-shell

  # Headless daemon + hgc on each OS. The scenario is the same.
  # Linux also checks that the child has no DISPLAY. Fixed ports
  # 17345/17346/8888 are still hardcoded; a busy port fails the job.
  serve-headless-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            script: scripts/smoke-headless-serve-linux.mjs
            serve_bin: src-tauri/target/debug/horizon-gateway-serve
            hgc_bin: src-tauri/target/debug/hgc
          - os: windows-latest
            script: scripts/smoke-headless-serve-windows.mjs
            serve_bin: src-tauri/target/debug/horizon-gateway-serve.exe
            hgc_bin: src-tauri/target/debug/hgc.exe
          - os: macos-latest
            script: scripts/smoke-headless-serve-macos.mjs
            serve_bin: src-tauri/target/debug/horizon-gateway-serve
            hgc_bin: src-tauri/target/debug/hgc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Build headless serve and hgc
        working-directory: src-tauri
        run: cargo build -p horizon-gateway-serve -p hgc

      - name: Headless daemon smoke
        env:
          HG_SERVE_BIN: ${{ matrix.serve_bin }}
          HG_HGC_BIN: ${{ matrix.hgc_bin }}
        run: node ${{ matrix.script }}

  # Accepted leftovers are ignored below. A new advisory fails this job.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.26.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-audit,cargo-deny

      - name: Audits
        run: |
          set -euo pipefail
          pnpm audit --json > /tmp/pnpm-audit.json || true
          node <<'JS'
          const fs = require("fs");
          const data = JSON.parse(fs.readFileSync("/tmp/pnpm-audit.json", "utf8"));
          const allowed = new Set([
            "braces",
            "esbuild",
            "vitest",
            "@vitest/mocker",
            "tinypool",
          ]);
          const unexpected = [];
          for (const advisory of Object.values(data.advisories || {})) {
            if (!allowed.has(advisory.module_name)) {
              unexpected.push(`${advisory.module_name}: ${advisory.title}`);
            }
          }
          if (unexpected.length) {
            console.error(unexpected.join("\n"));
            process.exit(1);
          }
          console.log("pnpm audit: only accepted leftovers");
          JS
          (
            cd src-tauri
            cargo audit \
              --ignore RUSTSEC-2026-0118 \
              --ignore RUSTSEC-2026-0119 \
              --ignore RUSTSEC-2026-0194 \
              --ignore RUSTSEC-2026-0195
            cargo deny check advisories sources
          )

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # Scan only the commits introduced by this PR or push, not repository history.
      - name: Scan pull request diff
        if: github.event_name == 'pull_request'
        run: gitleaks detect --redact --no-banner --exit-code 1 --log-opts="${{ github.event.pull_request.base.sha }}..HEAD"

      - name: Scan pushed commits
        if: github.event_name == 'push'
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            gitleaks detect --redact --no-banner --exit-code 1 --log-opts="-1"
          else
            gitleaks detect --redact --no-banner --exit-code 1 --log-opts="${{ github.event.before }}..${{ github.sha }}"
          fi

  # Packs a fixture MCPB from this commit and runs the MCPB validator.
  # Release builds replace the fixtures with the Windows and Linux hgc binaries.
  mcpb-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Check server.json and validate the MCPB
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/pack-hgc-mcpb.mjs --check
          node scripts/pack-hgc-mcpb.mjs --dry-run
          bash scripts/install-mcp-publisher.sh
          ./mcp-publisher validate server.json
          ./mcp-publisher validate dist/server.json
